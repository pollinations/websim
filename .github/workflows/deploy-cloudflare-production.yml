name: Deploy / Cloudflare production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websim-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/production' && (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Deploy Websim
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify both existing domains
        shell: bash
        run: |
          set -euo pipefail
          for host in websim.pollinations.ai websim.myceli.ai; do
            curl --fail --silent --show-error --retry 3 "https://$host/" --output /dev/null
            curl --fail --silent --show-error --retry 3 "https://$host/api/health" |
              node --input-type=module -e 'import assert from "node:assert/strict"; let body = ""; for await (const chunk of process.stdin) body += chunk; const health = JSON.parse(body); assert.equal(health.ok, true); assert.equal(health.assets, true); assert.equal(health.auth, "bearer");'
          done
