name = "websim"
main = "worker.js"
compatibility_date = "2026-05-01"

# Existing custom domains stay managed in Cloudflare; CI only updates the Worker.
workers_dev = false

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[vars]
PORT = "16386"

[observability]
enabled = true

[dev]
port = 16386
local_protocol = "http"
ip = "localhost"
